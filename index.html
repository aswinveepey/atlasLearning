margin-top:4px;opacity:.75}.lesson-link .check{color:#4f927c}.main{overflow:auto;padding:30px max(26px,4vw) calc(48px + env(safe-area-inset-bottom));background:radial-gradient(circle at 82% 0,rgba(120,189,168,.09),transparent 34%),#0a1714}.lesson{max-width:1040px;margin:0 auto}.lesson-head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:24px}.lesson-head h2{font:400 clamp(40px,5vw,66px)/.98 Georgia,serif;letter-spacing:-.04em;margin:10px 0 9px}.lesson-head p{margin:0;color:#a6b5af;font:400 18px/1.45 Georgia,serif;max-width:680px}.complete{border:1px solid var(--line);background:var(--rail);color:white;border-radius:999px;padding:11px 15px;white-space:nowrap}.complete.done{background:var(--mint);border-color:var(--mint);color:#102019}.paper{background:var(--paper);color:var(--ink);border:1px solid #d7cebd;border-radius:24px;padding:clamp(22px,4vw,42px);box-shadow:0 26px 70px rgba(0,0,0,.26)}.section{padding:28px 0;border-top:1px solid #d5ccba}.section:first-child{padding-top:0;border-top:0}.section h3{font:400 30px/1.12 Georgia,serif;margin:8px 0 14px}.section p{font:400 18px/1.62 Georgia,serif;color:#41514b;margin:0 0 15px}.callout{background:var(--mint2);border-left:4px solid #4d927c;padding:16px 18px;border-radius:0 14px 14px 0;font:500 17px/1.5 Georgia,serif;color:#27463c}.visual{margin:22px 0 12px;border:1px solid #d3c8b5;background:linear-gradient(145deg,#f8f5ed,#ebe3d5);border-radius:20px;padding:18px;overflow:hidden}.visual svg,.visual canvas{width:100%;height:auto;display:block}.visual canvas{height:310px}.controls{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:16px}.control{background:#e9e1d3;border-radius:14px;padding:12px}.control span{display:flex;justify-content:space-between;font-size:11px;color:#60706a;margin-bottom:8px}.control output{font:700 12px ui-monospace,SFMono-Regular,Menlo,monospace;color:#3f7e6b}.control input{width:100%;accent-color:#4c927c}.equation{overflow:auto;background:#17231f;color:#edf4f0;border-radius:15px;padding:18px;font:500 19px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap}.derivation{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}.step{background:#ebe4d7;border-radius:14px;padding:15px}.step b{display:block;color:#4e8e79;font:700 11px ui-monospace,SFMono-Regular,Menlo,monospace;margin-bottom:8px}.step p{font-size:15px;margin:0}.anchor{display:grid;grid-template-columns:1fr 1fr;gap:16px}.anchor-card{background:#ebe4d7;border-radius:16px;padding:18px}.anchor-card h4{font:500 20px Georgia,serif;margin:0 0 8px}.anchor-card p{font-size:15px;margin:0}.quiz{background:#17231f;color:#edf4f0;border-radius:18px;padding:22px}.quiz h3{color:white}.quiz p{color:#b9c7c2}.options{display:grid;gap:9px}.option{border:1px solid #355348;background:#1d302b;color:#eef4f1;border-radius:12px;padding:12px;text-align:left}.option.correct{border-color:#7cc5ab;background:#24483c}.option.wrong{border-color:#b86d4d;background:#472c24}.feedback{min-height:22px;margin-top:10px;color:#a9cbbf;font-size:13px}.nav{display:flex;align-items:center;justify-content:space-between;margin-top:20px}.nav button{border:1px solid var(--line);background:var(--rail);color:white;border-radius:999px;padding:11px 15px}.nav span{font-size:12px;color:#91a39c}.scrim{display:none}

<body>
<div class="app">
<header class="topbar"><button id="menu" class="menu">☰</button><div class="brand"><small>OGATA AS THE TECHNICAL SPINE</small><strong>Control Atlas</strong></div><div class="top-progress"><span id="progressText">1 of 4 lessons</span><div class="track"><i id="progressBar"></i></div></div></header>
<div class="shell">
<aside id="rail" class="rail"><div class="eyebrow">VISUAL COURSE · RELEASE 1</div><h1>From feedback to state</h1><nav id="lessonNav"></nav></aside>
<main id="main" class="main"><article id="lesson" class="lesson"></article></main>

<script>
const lessons=[
{id:'feedback',n:'01',title:'Why feedback works',sub:'The loop corrects itself',intro:'Begin with the physical idea before touching transfer functions: the output is measured, compared with the target, and used to change the next input.',sections:[
{type:'idea',title:'A controller is not a command generator',body:['An open-loop system acts and walks away. A closed-loop system acts, observes what happened, and corrects the next action. That repeated correction is feedback.','The crucial point is that stability, speed and accuracy are properties of the complete loop—not of the controller or plant in isolation.'],callout:'Negative feedback means the correction opposes the error. If the output is too low, the loop pushes upward; if it is too high, the loop pulls downward.'},
{type:'feedbackVisual',title:'Watch the loop correct a disturbance'},
{type:'math',title:'From the loop to the closed-loop transfer function',eq:'e(t) = r(t) − y(t)\nu(t) = C(s)e(t)\ny(t) = G(s)u(t)\n\nTherefore:\nT(s) = Y(s)/R(s) = C(s)G(s) / [1 + C(s)G(s)]',steps:['The reference and output are compared.','The controller acts on error.','The plant converts control into output.']},
{type:'anchor',title:'Engineering anchor',cards:[['Cruise control','A hill reduces speed. The speed sensor exposes the error and the throttle is increased until speed returns.'],['Active suspension','Body motion is sensed and actuator force is adjusted continuously—not once—to suppress vibration.']]},
{type:'quiz',title:'Check the intuition',q:'Why can increasing loop gain eventually make a system unstable?',opts:['Higher gain always reduces damping losses','Delay and phase lag can make the correction reinforce the error','The reference signal becomes too small'],answer:1,explain:'Correct. Once phase lag approaches 180°, a correction intended to oppose error can arrive late and reinforce it.'}]},
{id:'model',n:'02',title:'Model the physical system',sub:'Mass, spring and damper',intro:'Control begins by translating physical laws into a model that preserves the consequences we care about.',sections:[
{type:'idea',title:'Start with forces, not formulas',body:['Consider a mass connected to a spring and damper. Pull it and release it. The mass resists acceleration, the spring resists displacement, and the damper resists velocity.','Those three physical effects create the entire second-order behaviour: oscillation, decay and settling.'],callout:'The model is a bookkeeping system for cause and effect: applied force must equal the sum of inertial, damping and spring forces.'},
{type:'massVisual',title:'Change the physical parameters and watch the motion'},
{type:'math',title:'Build the differential equation',eq:'F(t) = m ẍ(t) + c ẋ(t) + k x(t)\n\nTaking the Laplace transform with zero initial conditions:\nF(s) = (m s² + c s + k)X(s)\n\nG(s) = X(s)/F(s) = 1 / (m s² + c s + k)',steps:['Newton: sum of forces equals mass × acceleration.','Replace derivatives with powers of s.','Collect X(s) and form output/input.']},
{type:'anchor',title:'Engineering anchor',cards:[['Vehicle suspension','Vehicle mass, tyre/spring stiffness and damper coefficient determine ride comfort and body control.'],['Machine isolation','Mount stiffness and damping decide whether motor vibration reaches the surrounding structure.']]},
{type:'quiz',title:'Check the intuition',q:'What happens when damping c is increased while m and k stay fixed?',opts:['Oscillation generally dies out faster','Natural frequency always increases sharply','The spring stores more energy'],answer:0,explain:'Correct. More damping removes energy faster, though excessive damping can also make the response sluggish.'}]},
{id:'poles',n:'03',title:'Poles become behaviour',sub:'See the s-plane physically',intro:'A pole is not an abstract algebraic object. Its position tells you whether motion grows, decays or oscillates.',sections:[
{type:'idea',title:'Every pole carries a time behaviour',body:['A real pole contributes an exponential. A complex-conjugate pair contributes an oscillation wrapped in an exponential envelope.','The real part decides growth or decay. The imaginary part decides oscillation frequency.'],callout:'Left-half-plane poles decay. Right-half-plane poles grow. Poles on the imaginary axis sustain oscillation without decay.'},
{type:'poleVisual',title:'Move the pole and watch the time response'},
{type:'math',title:'Read behaviour directly from the pole',eq:'s = σ ± jω\n\nx(t) ∝ e^{σt} cos(ωt + φ)\n\nσ < 0  → decay\nσ = 0  → sustained oscillation\nσ > 0  → growth',steps:['Real part σ sets the envelope.','Imaginary part ω sets oscillation speed.','Distance from origin sets natural frequency.']},
{type:'anchor',title:'Engineering anchor',cards:[['Aircraft pitch','Poorly damped pitch poles create long, uncomfortable oscillations after a disturbance.'],['Motor speed loop','Moving dominant poles left usually speeds settling, but actuator and noise constraints limit how far.']]},
{type:'quiz',title:'Check the intuition',q:'Can a system oscillate and still be asymptotically stable?',opts:['No, oscillation always means instability','Yes, if the complex poles have negative real parts','Only if the poles are exactly on the imaginary axis'],answer:1,explain:'Correct. Negative real parts make the oscillation envelope decay with time.'}]},
{id:'state',n:'04',title:'State is internal memory',sub:'From transfer functions to state space',intro:'A transfer function describes input–output behaviour. State space exposes the internal variables that carry the system from one instant to the next.',sections:[
{type:'idea',title:'State is the minimum sufficient memory',body:['For the mass–spring system, position alone is not enough to predict the future. Two masses can have the same position but different velocities and therefore move differently next.','Position and velocity together form a state: once they are known, the model can predict the next instant without needing the full past history.'],callout:'State does not mean every measurable variable. It means the smallest set of variables that makes the future conditionally independent of the past.'},
{type:'stateVisual',title:'Follow trajectories through state space'},
{type:'math',title:'Rewrite one second-order equation as two first-order equations',eq:'Choose:\nx₁ = x       (position)\nx₂ = ẋ      (velocity)\n\nThen:\nẋ₁ = x₂\nẋ₂ = −(k/m)x₁ − (c/m)x₂ + (1/m)u\n\nẋ = Ax + Bu',steps:['Choose variables that contain the needed memory.','Turn each derivative into a first-order update.','Collect the equations into matrix form.']},
{type:'anchor',title:'Engineering anchor',cards:[['Active suspension','State may include body displacement, body velocity, wheel displacement and wheel velocity.'],['Kalman filter','When state cannot be measured directly, an observer estimates it from the model and noisy sensors.']]},
{type:'quiz',title:'Check the intuition',q:'Why is position alone not a complete state for a moving mass?',opts:['Position cannot be measured accurately','Future motion also depends on current velocity','The spring constant is unknown'],answer:1,explain:'Correct. Equal position with different velocity leads to different future trajectories.'}]}
];
let current=Number(localStorage.getItem('atlas-v2-current')||0);const completed=new Set(JSON.parse(localStorage.getItem('atlas-v2-complete')||'[]'));
const lessonEl=document.getElementById('lesson'),navEl=document.getElementById('lessonNav');
function buildNav(){navEl.innerHTML=lessons.map((l,i)=>`<button class="lesson-link ${i===current?'active':''}" data-i="${i}"><span class="num">${l.n}</span><span><strong>${l.title}</strong><small>${l.sub}</small></span><span class="check">${completed.has(l.id)?'✓':''}</span></button>`).join('');navEl.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>select(+b.dataset.i)))}
function select(i){current=i;localStorage.setItem('atlas-v2-current',i);render();document.getElementById('rail').classList.remove('open');document.getElementById('scrim').classList.remove('show')}
function render(){const l=lessons[current];buildNav();document.getElementById('progressText').textContent=`${current+1} of ${lessons.length} lessons`;document.getElementById('progressBar').style.width=`${(current+1)/lessons.length*100}%`;lessonEl.innerHTML=`<header class="lesson-head"><div><div class="eyebrow">LESSON ${l.n}</div><h2>${l.title}</h2><p>${l.intro}</p></div><button id="complete" class="complete ${completed.has(l.id)?'done':''}">${completed.has(l.id)?'Completed':'Mark complete'}</button></header><div class="paper">${l.sections.map(sectionHTML).join('')}<div class="nav"><button id="prev">← Previous</button><span>${current+1} / ${lessons.length}</span><button id="next">Next →</button></div></div>`;document.getElementById('complete').onclick=()=>{completed.has(l.id)?completed.delete(l.id):completed.add(l.id);localStorage.setItem('atlas-v2-complete',JSON.stringify([...completed]));render()};document.getElementById('prev').onclick=()=>select((current-1+lessons.length)%lessons.length);document.getElementById('next').onclick=()=>select((current+1)%lessons.length);bindVisuals(l);bindQuiz();document.getElementById('main').scrollTo({top:0})}
function sectionHTML(s){if(s.type==='idea')return `<section class="section"><div class="label">INTUITION FIRST</div><h3>${s.title}</h3>${s.body.map(p=>`<p>${p}</p>`).join('')}<div class="callout">${s.callout}</div></section>`;if(s.type==='math')return `<section class="section"><div class="label">MATHEMATICAL STRUCTURE</div><h3>${s.title}</h3><div class="equation">${s.eq}</div><div class="derivation">${s.steps.map((x,i)=>`<div class="step"><b>STEP ${i+1}</b><p>${x}</p></div>`).join('')}</div></section>`;if(s.type==='anchor')return `<section class="section"><div class="label">REAL-WORLD ANCHOR</div><h3>${s.title}</h3><div class="anchor">${s.cards.map(c=>`<div class="anchor-card"><h4>${c[0]}</h4><p>${c[1]}</p></div>`).join('')}</div></section>`;if(s.type==='quiz')return `<section class="section"><div class="quiz"><div class="label">TINY QUIZ</div><h3>${s.title}</h3><p>${s.q}</p><div class="options">${s.opts.map((o,i)=>`<button class="option" data-answer="${s.answer}" data-i="${i}" data-explain="${s.explain}">${o}</button>`).join('')}</div><div class="feedback"></div></div></section>`;return `<section class="section"><div class="label">INTERACTIVE VISUAL</div><h3>${s.title}</h3>${visualHTML(s.type)}</section>`}
function visualHTML(type){if(type==='feedbackVisual')return `<div class="visual"><svg viewBox="0 0 820 270"><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4d927c"/></marker></defs><g fill="none" stroke="#4d927c" stroke-width="3"><circle cx="95" cy="110" r="24"/><path d="M119 110H210" marker-end="url(#ar)"/><rect x="215" y="75" width="130" height="70" rx="12"/><path d="M345 110H450" marker-end="url(#ar)"/><rect x="455" y="75" width="130" height="70" rx="12"/><path d="M585 110H700" marker-end="url(#ar)"/><path d="M650 110V220H95V138" marker-end="url(#ar)"/></g><g fill="#27463c" font-size="15" text-anchor="middle"><text x="95" y="116">Σ</text><text x="280" y="116">CONTROLLER</text><text x="520" y="116">PLANT</text><text x="700" y="100">OUTPUT</text><text x="370" y="242">MEASUREMENT RETURNS TO THE COMPARATOR</text></g><circle id="pulse" cx="140" cy="110" r="8" fill="#b86d4d"/></svg><div class="controls"><div class="control"><span>Target <output id="targetOut">1.0</output></span><input id="target" type="range" min="0" max="2" step="0.1" value="1"></div><div class="control"><span>Disturbance <output id="distOut">0.4</output></span><input id="dist" type="range" min="0" max="1" step="0.1" value="0.4"></div><div class="control"><span>Gain <output id="gainOut">2.0</output></span><input id="gain" type="range" min="0.2" max="6" step="0.1" value="2"></div></div><canvas id="loopChart"></canvas></div>`;if(type==='massVisual')return `<div class="visual"><svg viewBox="0 0 820 260"><path d="M30 60v160" stroke="#42564f" stroke-width="8"/><path id="spring" d="M35 120 h35 l15 -24 l30 48 l30 -48 l30 48 l30 -48 l30 48 l15 -24 h30" fill="none" stroke="#4d927c" stroke-width="4"/><rect id="mass" x="300" y="75" width="120" height="90" rx="12" fill="#d6ebe3" stroke="#4d927c" stroke-width="3"/><path d="M35 190h100v-26h80v52h80v-26h40" fill="none" stroke="#b69545" stroke-width="4"/><line x1="0" y1="220" x2="820" y2="220" stroke="#a9a08f" stroke-width="3"/><text id="massLabel" x="360" y="130" text-anchor="middle" fill="#27463c" font-size="18">m = 1.0</text></svg><div class="controls"><div class="control"><span>Mass m <output id="mOut">1.0</output></span><input id="m" type="range" min="0.5" max="5" step="0.1" value="1"></div><div class="control"><span>Damping c <output id="cOut">0.8</output></span><input id="c" type="range" min="0" max="5" step="0.1" value="0.8"></div><div class="control"><span>Stiffness k <output id="kOut">4.0</output></span><input id="k" type="range" min="1" max="12" step="0.1" value="4"></div></div><canvas id="massChart"></canvas></div>`;if(type==='poleVisual')return `<div class="visual"><svg id="polePlane" viewBox="0 0 820 300"><line x1="50" y1="150" x2="770" y2="150" stroke="#8f968f"/><line x1="410" y1="25" x2="410" y2="275" stroke="#8f968f"/><text x="750" y="138" fill="#697771">Re</text><text x="420" y="38" fill="#697771">Im</text><line id="poleStem1"/><line id="poleStem2"/><circle id="pole1" r="10" fill="#b86d4d"/><circle id="pole2" r="10" fill="#b86d4d"/></svg><div class="controls"><div class="control"><span>Real part σ <output id="sigmaOut">−0.60</output></span><input id="sigma" type="range" min="-2" max="1" step="0.05" value="-0.6"></div><div class="control"><span>Imaginary part ω <output id="omegaOut">2.00</output></span><input id="omega" type="range" min="0" max="5" step="0.05" value="2"></div><div class="control"><span>Interpretation <output id="poleStatus">decaying</output></span></div></div><canvas id="poleChart"></canvas></div>`;return `<div class="visual"><canvas id="stateCanvas"></canvas><div class="controls"><div class="control"><span>Damping <output id="stateDOut">0.35</output></span><input id="stateD" type="range" min="0" max="1.5" step="0.05" value="0.35"></div><div class="control"><span>Stiffness <output id="stateKOut">1.0</output></span><input id="stateK" type="range" min="0.3" max="3" step="0.1" value="1"></div><div class="control"><span>Initial velocity <output id="stateVOut">1.6</output></span><input id="stateV" type="range" min="-3" max="3" step="0.1" value="1.6"></div></div></div>`}
function bindQuiz(){document.querySelectorAll('.option').forEach(b=>b.onclick=()=>{const box=b.closest('.quiz');box.querySelectorAll('.option').forEach(x=>x.classList.remove('correct','wrong'));const ok=+b.dataset.i===+b.dataset.answer;b.classList.add(ok?'correct':'wrong');if(!ok)box.querySelectorAll('.option')[+b.dataset.answer].classList.add('correct');box.querySelector('.feedback').textContent=ok?b.dataset.explain:'Not quite. '+b.dataset.explain})}
function canvasSetup(id){const c=document.getElementById(id);if(!c)return null;const r=c.getBoundingClientRect(),d=devicePixelRatio||1;c.width=r.width*d;c.height=r.height*d;const x=c.getContext('2d');x.scale(d,d);return {c,x,w:r.width,h:r.height}}
function axes(ctx,w,h,ymin=-1.5,ymax=2){ctx.strokeStyle='#d2c9b8';ctx.lineWidth=1;for(let i=0;i<5;i++){const y=20+(h-45)*i/4;ctx.beginPath();ctx.moveTo(38,y);ctx.lineTo(w-12,y);ctx.stroke()}ctx.strokeStyle='#7b8c85';ctx.beginPath();ctx.moveTo(38,12);ctx.lineTo(38,h-25);ctx.lineTo(w-12,h-25);ctx.stroke();return {X:t=>38+(w-55)*t/8,Y:y=>h-25-(h-45)*(y-ymin)/(ymax-ymin)}}
function bindVisuals(l){if(l.id==='feedback'){const controls=['target','dist','gain'].map(id=>document.getElementById(id));let phase=0;function draw(){targetOut.value=(+target.value).toFixed(1);distOut.value=(+dist.value).toFixed(1);gainOut.value=(+gain.value).toFixed(1);const z=canvasSetup('loopChart');if(!z)return;const a=axes(z.x,z.w,z.h,-.2,2.2);let y=0;z.x.strokeStyle='#4d927c';z.x.lineWidth=3;z.x.beginPath();for(let i=0;i<=320;i++){const t=8*i/320;const r=+target.value,d=+dist.value,g=+gain.value;y=r*(1-Math.exp(-g*.45*t))-d*(t>2?Math.exp(-(t-2)*g*.55):0);i?z.x.lineTo(a.X(t),a.Y(y)):z.x.moveTo(a.X(t),a.Y(y))}z.x.stroke();z.x.strokeStyle='#b86d4d';z.x.setLineDash([5,5]);z.x.beginPath();z.x.moveTo(a.X(0),a.Y(+target.value));z.x.lineTo(a.X(8),a.Y(+target.value));z.x.stroke();z.x.setLineDash([])}controls.forEach(c=>c.oninput=draw);draw();setInterval(()=>{const p=document.getElementById('pulse');if(p){phase=(phase+3)%500;p.setAttribute('cx',140+Math.min(phase,430));p.setAttribute('cy',110)}},40)}
if(l.id==='model'){function draw(){mOut.value=(+m.value).toFixed(1);cOut.value=(+c.value).toFixed(1);kOut.value=(+k.value).toFixed(1);massLabel.textContent=`m = ${mOut.value}`;const z=canvasSetup('massChart');if(!z)return;const a=axes(z.x,z.w,z.h,-1.3,1.3);const M=+m.value,C=+c.value,K=+k.value;let x=1,v=0,dt=.01,t=0;z.x.strokeStyle='#4d927c';z.x.lineWidth=3;z.x.beginPath();for(let i=0;i<=800;i++){const acc=(-C*v-K*x)/M;v+=acc*dt;x+=v*dt;t+=dt;i?z.x.lineTo(a.X(t),a.Y(x)):z.x.moveTo(a.X(t),a.Y(x))}z.x.stroke()}[m,c,k].forEach(q=>q.oninput=draw);draw()}
if(l.id==='poles'){function draw(){sigmaOut.value=(+sigma.value).toFixed(2).replace('-','−');omegaOut.value=(+omega.value).toFixed(2);poleStatus.value=+sigma.value<0?'decaying':(+sigma.value>0?'growing':'sustained');const sx=410+(+sigma.value)*150,wy=(+omega.value)*23;pole1.setAttribute('cx',sx);pole1.setAttribute('cy',150-wy);pole2.setAttribute('cx',sx);pole2.setAttribute('cy',150+wy);const z=canvasSetup('poleChart');if(!z)return;const a=axes(z.x,z.w,z.h,-2,2);z.x.strokeStyle='#4d927c';z.x.lineWidth=3;z.x.beginPath();for(let i=0;i<=320;i++){const t=8*i/320,y=Math.exp((+sigma.value)*t)*Math.cos((+omega.value)*t);i?z.x.lineTo(a.X(t),a.Y(Math.max(-2,Math.min(2,y)))):z.x.moveTo(a.X(t),a.Y(y))}z.x.stroke()}[sigma,omega].forEach(q=>q.oninput=draw);draw()}
if(l.id==='state'){function draw(){stateDOut.value=(+stateD.value).toFixed(2);stateKOut.value=(+stateK.value).toFixed(1);stateVOut.value=(+stateV.value).toFixed(1);const z=canvasSetup('stateCanvas');if(!z)return;const ctx=z.x,w=z.w,h=z.h;ctx.strokeStyle='#d2c9b8';for(let i=0;i<7;i++){let x=30+(w-60)*i/6;ctx.beginPath();ctx.moveTo(x,20);ctx.lineTo(x,h-25);ctx.stroke()}for(let i=0;i<7;i++){let y=20+(h-45)*i/6;ctx.beginPath();ctx.moveTo(30,y);ctx.lineTo(w-20,y);ctx.stroke()}const X=x=>w/2+x*(w-70)/7,Y=v=>h/2-v*(h-55)/7;ctx.strokeStyle='#4d927c';ctx.lineWidth=3;ctx.beginPath();let x=2.4,v=+stateV.value,dt=.015;for(let i=0;i<900;i++){let a=-(+stateK.value)*x-(+stateD.value)*v;v+=a*dt;x+=v*dt;i?ctx.lineTo(X(x),Y(v)):ctx.moveTo(X(x),Y(v))}ctx.stroke();ctx.fillStyle='#27463c';ctx.font='12px -apple-system';ctx.fillText('position x₁',w-90,h-8);ctx.save();ctx.translate(12,90);ctx.rotate(-Math.PI/2);ctx.fillText('velocity x₂',0,0);ctx.restore()}[stateD,stateK,stateV].forEach(q=>q.oninput=draw);draw()}}
window.addEventListener('resize',()=>render());document.getElementById('menu').onclick=()=>{document.getElementById('rail').classList.add('open');document.getElementById('scrim').classList.add('show')};document.getElementById('scrim').onclick=()=>{document.getElementById('rail').classList.remove('open');document.getElementById('scrim').classList.remove('show')};if('serviceWorker'in navigator)navigator.serviceWorker.register('./service-worker.js');render();
</script>
</body></html>
